 $('main').innerHTML=heading('Monthly summary')+'<section class="card glow-card" '+cardStyle('summary:selected',palette.selected)+'><div class="card-top"><span class="metric-icon">↗</span><h3 class="card-label">Expense comparison</h3>'+colorButton('summary:selected','Expense comparison')+'</div><label>Selected month<input type="month" id="comparison" value="'+esc(m)+'"></label><div class="amount negative">'+money(current)+'</div><span class="period-pill">Expenses in '+niceMonth(m)+'</span></section><div class="split section-space">'+[['mom','Previous month',prev],['yoy','Same month last year',last]].map(([key,title,period])=>{const previous=map[period]?.expenseCount?map[period].expenses:null,c=comparison(current,previous,!!map[m]?.expenseCount);return '<section class="card glow-card" '+cardStyle('summary:'+key,palette[key])+'><div class="card-top"><span class="metric-icon">↔</span><h3 class="card-label">'+title+'</h3>'+colorButton('summary:'+key,title)+'</div><h3 class="comparison-result '+c.kind+'">'+c.title+'</h3><p class="muted">'+c.detail+'</p><div class="comparison-baseline"><small>Selected: '+money(current)+' · '+niceMonth(m)+'</small><small>Earlier: '+(previous===null?'No expenses recorded':money(previous))+' · '+niceMonth(period)+'</small></div></section>'}).join('')+'</div><section class="card glow-card section-space" '+cardStyle('summary:history',palette.history)+'><div class="card-top"><span class="metric-icon">▤</span><h3 class="card-label">Monthly totals</h3>'+colorButton('summary:history','Monthly totals')+'</div><div class="table-wrap"><table><thead><tr><th>Month</th><th class="positive">↙ Income</th><th class="negative">↗ Expenses</th><th>Income vs expenses</th></tr></thead><tbody>'+keys.map(k=>{const n=map[k].income-map[k].expenses;return '<tr><td>'+niceMonth(k)+'</td><td class="positive">'+money(map[k].income)+'</td><td class="negative">'+money(map[k].expenses)+'</td><td class="'+(n<0?'negative':'positive')+'">'+money(Math.abs(n))+(n<0?' more spent function settingsView(){$('main').innerHTML=heading('Settings')+'<div class="settings"><section class="card glow-card" '+cardStyle('settings:appearance',palette.appearance)+'><div class="card-top"><span class="metric-icon">◐</span><h3 class="card-label">Appearance</h3>'+colorButton('settings:appearance','Appearance')+'</div><label>Display mode<select id="mode">'+['light','dark','midnight'].map(m=>'<option '+(settings.mode===m?'selected':'')+' value="'+m+'">'+m[0].toUpperCase()+m.slice(1)+'</option>').join('')+'</select></label><label>Accent color</label><div class="swatches">'+['blue','green','purple','red','yellow','teal'].map(c=>'<button data-theme-choice="'+c+'" aria-pressed="'+(settings.theme===c)+'">'+c[0].toUpperCase()+c.slice(1)+'</button>').join('')+action('custom-accent','Custom',undefined,'aria-pressed="'+(settings.theme==='custom')+'"')+'</div></section><section class="card glow-card" '+cardStyle('settings:backup',palette.backup)+'><div class="card-top"><span class="metric-icon">▣</span><h3 class="card-label">Data & backup</h3>'+colorButton('settings:backup','Data & backup')+'</div><p class="muted">Records, colors, selected savings wallet and date filters are saved on this device. Save .tite to keep them together in a file. Opening a backup replaces the current records and settings.</p><p class="muted">A .tite backup is encoded, not encrypted. Keep it somewhere private.</p><div class="actions">'+action('save','Save .tite',undefined,'','primary')+action('reset-filters','Reset all filters')+action('clear','Delete all records',undefined,'','danger')+'</div></section></div>'}
function field(name,label,type='text',value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(name,label,options,value){return `<label>${label}<select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`}
function modal(title,fields,context){editing=context;$('modal-title').textContent=title;$('fields').innerHTML=`<div class="list">${fields}</div>`;$('form-error').textContent='';$('form').querySelector('button[type=submit]').hidden=false;$('modal').showModal();setTimeout(()=>$('fields').querySelector('input,select')?.focus(),0)}
function currentRows(){return tab.startsWith('wallet:')?data.customPages[tab.slice(7)]:data[tab]}
function recordModal(kind,index=-1){const wallet=kind.startsWith('wallet:'),rows=wallet?data.customPages[kind.slice(7)]:data[kind],r=rows[index]||{},debt=kind==='debts';modal(index<0?'Add '+(debt?'debt':wallet?'transaction':kind==='income'?'income':'expense'):'Edit record',field('desc','Description','text',r.desc||'','required maxlength="200"')+(wallet?select('type','Transaction type',[['DEPOSIT','Deposit'],['WITHDRAWAL','Withdrawal'],['INTEREST','Interest'],['TAX','Tax']],r.type||(r.amount<0?(r.desc==='TAX DEDUCTION'?'TAX':'WITHDRAWAL'):(r.desc==='INTEREST EARNED'?'INTEREST':'DEPOSIT'))):'')+field('amount',debt?'Debt amount':'Amount (PHP)','number',debt?r.t??'':Math.abs(r.amount||0)||'','required min="0.01" step="0.01"')+(debt?field('paid','Already paid (PHP)','number',r.paid||0,'required min="0" step="0.01"')+field('notes','Notes (optional)','text',r.notes||'','maxlength="500"'):'')+field('date',debt?'Date debt added':'Date','date',r.date||today(),'required'),{type:'record',kind,index})}
function goalModal(index=-1){if(!Object.keys(data.customPages).length){tell('Create a wallet first.');return}const g=data.savingsGoals[index]||{};modal(index<0?'Add savings goal':'Edit savings goal',field('name','Goal name','text',g.name||'','required maxlength="100"')+select('wallet','Wallet',Object.keys(data.customPages).map(n=>[n,n]),g.wallet)+field('target','Target amount (PHP)','number',g.target||'','required min="0.01" step="0.01"'),{type:'goal',index})}
function confirmDelete(message,fn){if(confirm(message)){fn();persist();render()}}
async function saveFile(){const content=encode(JSON.stringify(bundle()));try{if(!fileHandle&&window.showSaveFilePicker){try{fileHandle=await window.showSaveFilePicker({suggestedName:`tite_${today()}.tite`,types:[{description:'TITE backup',accept:{'text/plain':['.tite']}}]})}catch(e){if(e.name==='AbortError')return;if(e.name!=='SecurityError'&&e.name!=='NotAllowedError')throw e}}if(fileHandle){const writer=await fileHandle.createWritable();await writer.write(content);await writer.close();$('save-state').textContent='Saved on this device and in .tite';tell('Saved records, theme and filters to .tite.')}else{const url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`tite_${today()}.tite`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('save-state').textContent='.tite download requested';tell('Backup download requested. It includes records, theme and filters.')}dirty=false}catch(e){tell('Could not save the file. Your records are still on this device.')}}
$('save-file').onclick=saveFile;$('open-file').onclick=()=>$('import').click();$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('Backup is too large (maximum 20 MB).');const text=await file.text();const n=normalize(JSON.parse(text.trim().startsWith('{')?text:decode(text)));if(!confirm('Replace current records and settings with this backup? Save your current .tite first if needed.'))return;data=n.data;settings=n.settings;fileHandle=null;pages={};persist();render();tell('Backup opened. Records, theme and filters restored.')}catch(e){tell('Could not open backup: '+e.message)}finally{e.target.value=''}};
$('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
$('nav').onchange=e=>{if(e.target.id==='mobile-page'){tab=e.target.value;render()}};
$('main').addEventListener('change',e=>{const el=e.target,container=el.closest('[data-filter]');if(container){const key=container.dataset.filter,f={...filter(key),[el.dataset.field]:el.value};if(!el.checkValidity()){el.reportValidity();return}if(f.type==='RANGE'&&f.start&&f.end&&f.start>f.end){tell('From date must be on or before To date.');el.value=filter(key)[el.dataset.field]||'';return}settings.filters[key]=f;pages[key]=1;persist();render()}else if(el.id==='savings-wallet'){settings.savingsWallet=el.value;persist();render()}else if(el.id==='mode'){settings.mode=el.value;persist();render()}else if(el.id==='comparison'){if(!el.value)return;settings.comparisonMonth=el.value;persist();render()}});
$('main').addEventListener('input',e=>{const el=e.target;if(el.dataset.search){const position=el.selectionStart;settings.searches[el.dataset.search]=el.value;pages[el.dataset.search]=1;persist();render();$('search').focus();$('search').setSelectionRange(position,position)}});
$('main').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.themeChoice){settings.theme=b.dataset.themeChoice;persist();render();return}const a=b.dataset.action,i=Number(b.dataset.index),category=b.dataset.category;
 if(a==='custom-accent'){colorModal('accent:custom','Custom accent');return}
 if(a==='card-color'){colorModal(b.dataset.colorKey,b.dataset.colorLabel);return}
 if(a==='new-income')recordModal('income');else if(a==='new-expenses')recordModal('expenses');else if(a==='new-record')recordModal(tab);else if(a==='edit-record')recordModal(tab,i);else if(a==='delete-record')confirmDelete('Delete this record?',()=>currentRows().splice(i,1));else if(a==='new-goal')goalModal();else if(a==='edit-goal')goalModal(i);else if(a==='delete-goal')confirmDelete('Delete this savings goal?',()=>data.savingsGoals.splice(i,1));else if(a==='back-wallets'){tab='wallets';render()}else if(a==='new-wallet'||a==='rename-wallet'){const name=a==='rename-wallet'?Object.keys(data.customPages)[i]:'';modal(name?'Rename wallet':'Add wallet',field('name','Wallet name','text',name,'required maxlength="100"'),{type:'wallet',oldName:name})}else if(a==='open-wallet'){tab='wallet:'+Object.keys(data.customPages)[i];render()}else if(a==='delete-wallet'){const name=Object.keys(data.customPages)[i];confirmDelete(`Delete "${name}", all its transactions and linked goals?`,()=>{delete data.customPages[name];if(settings.savingsWallet===name)settings.savingsWallet='';data.savingsGoals=data.savingsGoals.filter(g=>g.wallet!==name)})}else if(a==='pay-debt'){const r=data.debts[i];if(r.paid>=r.t){tell('This debt is fully paid.');return}modal('Add payment',`<p>${esc(r.desc)} · ${money(r.t-r.paid)} remaining</p>`+field('amount','Payment amount (PHP)','number','','required min="0.01" step="0.01" max="'+(r.t-r.paid).toFixed(2)+'"')+field('date','Payment date','date',today(),'required'),{type:'payment',index:i})}else if(a==='history'){const r=data.debts[i];modal('Payment history',`<h3>${esc(r.desc)}</h3><div class="list">${(r.history||[]).map(h=>`<div class="row"><span>${esc(h.date)}${h.note?' · '+esc(h.note):''}</span><strong>${money(h.amount)}</strong></div>`).join('')||'<p class="muted">No recorded payments.</p>'}</div>`,{type:'history'});$('form').querySelector('button[type=submit]').hidden=true}else if(a==='edit-budget'){const b=data.budgetPlan;modal('Budget allocation',field('base','Planned amount (PHP)','number',b.base,'required min="0" step="0.01"')+Object.entries(b.percentages).map(([k,v])=>field(k,k[0].toUpperCase()+k.slice(1)+' (%)','number',v,'required min="0" max="100" step="0.01"')).join(''),{type:'budget'})}else if(a==='new-budget-item')modal('Add budget item',field('name','Item name','text','','required maxlength="200"')+field('amount','Amount (PHP)','number','','required min="0.01" step="0.01"'),{type:'budget-item',category});else if(a==='delete-budget-item')confirmDelete('Remove this budget item?',()=>data.budgetPlan.items[category].splice(i,1));else if(a==='prev'||a==='next'){pages['list:'+tab]+=(a==='next'?1:-1);render()}else if(a==='save')saveFile();else if(a==='reset-filters')confirmDelete('Reset every saved date filter and search?',()=>{settings.filters={};settings.searches={};settings.savingsWallet='';pages={}});else if(a==='clear')confirmDelete('Delete all records, wallets, goals and budgets from this device? Saved .tite files will remain available.',()=>{data=blank();settings.savingsWallet='';pages={};fileHandle=null})
};
$('fields').addEventListener('input',e=>{if(editing?.type!=='color')return;const value=e.target.value;if(!/^#[0-9a-f]{6}$/i.test(value))return;$('color-wheel').value=value;$('color-hex').value=value;$('fields').querySelector('.color-preview').style.setProperty('--card-color',value)});
$('fields').addEventListener('click',e=>{if(editing?.type!=='color')return;const preset=e.target.closest('[data-preset]');let value=preset?.dataset.preset;if(e.target.id==='reset-card-color')value=palette[editing.key.split(':')[1]]||'#9164e8';if(value){$('color-wheel').value=value;$('color-hex').value=value;$('fields').querySelector('.color-preview').style.setProperty('--card-color',value)}});
$('main').addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const card=e.target.closest('.glow-card');if(card){const r=card.getBoundingClientRect();card.style.setProperty('--pointer-x',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--pointer-y',((e.clientY-r.top)/r.height*100)+'%')}});
$('close-modal').onclick=$('cancel-modal').onclick=()=>$('modal').close();
$('form').onsubmit=e=>{e.preventDefault();if(editing?.type==='history')return;const v=Object.fromEntries(new FormData(e.target)),ctx=editing;try{for(const name of ['amount','paid','target','base','needs','savings','emergency','wants'])if(name in v&&!Number.isFinite(Number(v[name])))throw Error('Enter a valid amount.');if(v.date&&(!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||new Date(v.date+'T12:00:00').toISOString().slice(0,10)!==v.date))throw Error('Enter a valid date.');if('desc'in v&&!v.desc.trim())throw Error('Enter a description.');if('name'in v&&!v.name.trim())throw Error('Enter a name.');
 if(ctx.type==='record'){const wallet=ctx.kind.startsWith('wallet:'),rows=wallet?data.customPages[ctx.kind.slice(7)]:data[ctx.kind],old=rows[ctx.index],r={desc:v.desc.trim(),date:v.date};if(ctx.kind==='debts'){const t=Number(v.amount),paid=Number(v.paid);if(paid>t)throw Error('Paid amount cannot exceed the debt amount.');r.t=t;r.paid=paid;r.notes=v.notes.trim();r.status=paid>=t?'PAID':paid>0?'PARTIAL':'NOT PAID';r.history=clone(old?.history||[]);const recorded=r.history.reduce((n,h)=>n+Number(h.amount),0);const adjustment=Math.round((paid-recorded)*100)/100;if(adjustment<0)throw Error('Paid amount cannot be below recorded payments.');if(adjustment>0)r.history.push({date:v.date,amount:adjustment,note:'Opening payment / adjustment'})}else{r.amount=Number(v.amount)*(wallet&&['WITHDRAWAL','TAX'].includes(v.type)?-1:1);if(wallet)r.type=v.type}if(ctx.index<0)rows.unshift(r);else rows[ctx.index]=r;tab=ctx.kind}
 else if(ctx.type==='payment'){const r=data.debts[ctx.index],amount=Number(v.amount);if(amount<=0||amount>Math.round((r.t-r.paid)*100)/100)throw Error('Payment must be positive and cannot exceed the remaining debt.');r.history??=[];r.history.push({date:v.date,amount});r.paid=Math.round((r.paid+amount)*100)/100;r.status=r.paid>=r.t?'PAID':'PARTIAL'}
 else if(ctx.type==='goal'){const g={id:ctx.index<0?crypto.randomUUID():data.savingsGoals[ctx.index].id,name:v.name.trim(),wallet:v.wallet,target:Number(v.target)};if(ctx.index<0)data.savingsGoals.push(g);else data.savingsGoals[ctx.index]=g}
 else if(ctx.type==='wallet'){const name=v.name.trim();if(['__proto__','constructor','prototype'].includes(name))throw Error('Choose a different wallet name.');if(name!==ctx.oldName&&Object.prototype.hasOwnProperty.call(data.customPages,name))throw Error('A wallet with this name already exists.');if(name!==ctx.oldName){data.customPages[name]=ctx.oldName?data.customPages[ctx.oldName]:[];if(ctx.oldName){delete data.customPages[ctx.oldName];if(settings.savingsWallet===ctx.oldName)settings.savingsWallet=name;if(settings.cardColors['wallet:'+ctx.oldName]){settings.cardColors['wallet:'+name]=settings.cardColors['wallet:'+ctx.oldName];delete settings.cardColors['wallet:'+ctx.oldName]}data.savingsGoals.forEach(g=>{if(g.wallet===ctx.oldName)g.wallet=name});for(const k of ['filters','searches']){const old='list:wallet:'+ctx.oldName;if(Object.prototype.hasOwnProperty.call(settings[k],old)){settings[k]['list:wallet:'+name]=settings[k][old];delete settings[k][old]}}}}}
 else if(ctx.type==='budget'){const total=['needs','savings','emergency','wants'].reduce((n,k)=>n+Number(v[k]),0);if(Math.abs(total-100)>.001)throw Error('Percentages must total 100%.');data.budgetPlan.base=Number(v.base);for(const k of Object.keys(data.budgetPlan.percentages))data.budgetPlan.percentages[k]=Number(v[k])}
 else if(ctx.type==='color'){if(ctx.key==='accent:custom'){settings.customAccent=v.color;settings.theme='custom'}else settings.cardColors[ctx.key]=v.color}
 else if(ctx.type==='budget-item')data.budgetPlan.items[ctx.category].push({name:v.name.trim(),amount:Number(v.amount)});
 persist();$('modal').close();render();tell('Saved on this device.');}catch(err){$('form-error').textContent=err.message}};
load();theme();render();
